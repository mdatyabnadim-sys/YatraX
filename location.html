<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YatraX | Location</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css">
<link rel="stylesheet" href="location.css">
<link rel="stylesheet" href="reviews.css">
</head>
<body>

<button class="map-btn" onclick="openMap()">MAP</button>

<header>
    <div class="header-left">
        <button class="header-back" id="backBtn">← Back</button>
        <a href="index.html" class="logo">Yatra<span>X</span></a>
    </div>
    <div class="header-nav">
        <a href="wishlist.html" class="nav-link">
            <span class="heart-emoji">❤️</span>
            <span id="wishlistBadge" class="wishlist-badge">0</span>
        </a>
        <div id="authArea" class="auth-area"></div>
    </div>
</header>

<div id="content"><div class="loading-msg">Loading location...</div></div>

<section class="map-section" id="mapSection">
  <div class="map-box">
    <div class="map-heading">
      <div>
        <h2 id="mapTitle">Location Map</h2>
        <p>Explore online or use the preloaded offline map.</p>
      </div>
      <div class="map-buttons">
        <button class="map-toggle active" id="onlineBtn" onclick="showOnline()">Online Map</button>
        <button class="map-toggle" id="offlineBtn" onclick="showOffline()">Offline Map</button>
        <button class="close-map" onclick="closeMap()">×</button>
      </div>
    </div>
    <div class="map-frame">
      <div id="onlineMap" class="online-map">
        <iframe id="onlineMapFrame" src="" loading="lazy" allowfullscreen></iframe>
      </div>
      <div id="offlineMap" class="offline-map"></div>
    </div>
  </div>
</section>

<section class="reviews-section" id="reviewsSection">
  <div class="reviews-heading">
    <h2>Reviews & Comments</h2>
    <p>Share your experience with other travellers.</p>
  </div>

  <div class="review-write" id="reviewWriteForm" style="display:none;">
    <span class="write-label">Write a review</span>
    <div class="star-selector" id="starSelector">
      <span class="star" data-star="1">★</span>
      <span class="star" data-star="2">★</span>
      <span class="star" data-star="3">★</span>
      <span class="star" data-star="4">★</span>
      <span class="star" data-star="5">★</span>
    </div>
    <textarea id="reviewText" placeholder="Share your experience..."></textarea>
    <button class="post-btn" onclick="submitReview()">Post Review</button>
  </div>

  <div class="login-prompt" id="loginPromptBox" style="display:none;">
    Please <a href="auth.html">login</a> to write a review, like, or reply.
  </div>

  <div class="review-list" id="reviewList"></div>
</section>

<footer>
  <div class="footer-logo">Yatra<span>X</span></div>
  Explore more. Travel better.
</footer>

<script src="common.js"></script>
<script src="reviews.js"></script>
<script src="location.js"></script>
</body>
</html>
