<html lang="en">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YatraX | Destination</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'DM Sans',sans-serif;background:#071713;color:#f4f7f3;min-height:100vh;}
header{height:75px;display:flex;justify-content:center;align-items:center;background:rgba(7,23,19,0.94);border-bottom:1px solid rgba(255,255,255,0.08);position:sticky;top:0;z-index:100;}
.logo{font-family:'Playfair Display',serif;font-size:30px;font-weight:600;letter-spacing:1px;}
.logo span{color:#5bd0a8;}
.back-btn{position:fixed;top:15px;left:18px;z-index:1000;padding:10px 17px;border:1px solid rgba(255,255,255,.15);border-radius:30px;background:#0b3025;color:#fff;font-size:13px;font-weight:600;cursor:pointer;transition:.25s ease;}
.back-btn:hover{background:#14543f;transform:translateY(-2px);}
.map-btn{position:fixed;right:20px;bottom:20px;z-index:5000;padding:12px 20px;border:none;border-radius:30px;background:#5bd0a8;color:#062119;font-size:14px;font-weight:bold;cursor:pointer;box-shadow:0 8px 25px rgba(0,0,0,.4);transition:.25s;}
.map-btn:hover{transform:translateY(-3px);background:#7be3ca;}

.hero{height:520px;position:relative;display:flex;align-items:flex-end;background-size:cover;background-position:center;}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 30%,rgba(2,12,9,.94));}
.hero-content{position:relative;z-index:2;width:90%;max-width:1200px;margin:auto;padding-bottom:50px;}
.hero-small{color:#5bd0a8;font-size:12px;font-weight:700;letter-spacing:3px;text-transform:uppercase;margin-bottom:12px;}
.hero h1{font-family:'Playfair Display',serif;font-size:64px;margin-bottom:10px;line-height:1.05;}
.hero p{max-width:650px;color:#c8d5d0;font-size:16px;line-height:1.6;}

.container{width:90%;max-width:1100px;margin:auto;padding:60px 0;}
.section{margin-bottom:50px;}
.section h2{font-family:'Playfair Display',serif;font-size:32px;margin-bottom:16px;}
.section p{color:#c2d0ca;line-height:1.8;font-size:15px;}
.notice{background:#102a22;border:1px solid #5bd0a8;border-radius:14px;padding:20px;color:#aebdb7;font-size:13px;line-height:1.6;margin-top:40px;}
.notice strong{color:#5bd0a8;display:block;margin-bottom:6px;font-size:14px;}
.loading{text-align:center;padding:80px;color:#91a69d;font-size:16px;}

.loc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:24px;}
.loc-card{height:250px;position:relative;overflow:hidden;border-radius:18px;cursor:pointer;background:#0c211b;border:1px solid rgba(255,255,255,0.09);box-shadow:0 15px 35px rgba(0,0,0,.35);transition:.3s;}
.loc-card:hover{transform:translateY(-6px);box-shadow:0 25px 50px rgba(0,0,0,.5);}
.loc-card img{width:100%;height:100%;object-fit:cover;transition:.5s;}
.loc-card:hover img{transform:scale(1.06);}
.loc-card::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 30%,rgba(2,12,9,.95));}
.loc-info{position:absolute;left:18px;right:18px;bottom:16px;z-index:2;}
.loc-tag{color:#5bd0a8;font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:5px;}
.loc-info h3{font-family:'Playfair Display',serif;font-size:22px;margin-bottom:4px;}
.loc-info p{color:#aebdb7;font-size:11px;}

/* MAP */
.map-section{display:none;padding:0 0 70px;animation:mapOpen .3s ease;}
.map-section.show{display:block;}
@keyframes mapOpen{from{opacity:0;transform:translateY(15px);}to{opacity:1;transform:translateY(0);}}
.map-box{background:#0b211b;border:1px solid rgba(255,255,255,.09);border-radius:23px;padding:30px;box-shadow:0 25px 55px rgba(0,0,0,.3);}
.map-heading{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:20px;}
.map-heading h2{font-family:'Playfair Display',serif;font-size:30px;margin-bottom:7px;}
.map-heading p{color:#91a69d;font-size:13px;}
.map-buttons{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
.map-toggle{padding:11px 17px;border:none;border-radius:25px;background:#102a22;color:#edf4f1;border:1px solid rgba(255,255,255,.12);font-size:12px;font-weight:700;cursor:pointer;transition:.2s;}
.map-toggle.active{background:#5bd0a8;color:#062119;border-color:#5bd0a8;}
.map-toggle:hover{transform:translateY(-2px);}
.close-map{width:40px;height:40px;border:none;border-radius:50%;background:#071713;color:white;font-size:20px;cursor:pointer;border:1px solid rgba(255,255,255,.12);transition:.2s;}
.close-map:hover{background:#12332c;}
.map-frame{width:100%;height:520px;border-radius:17px;overflow:hidden;background:#071713;position:relative;}
.online-map{width:100%;height:100%;}
.online-map iframe{width:100%;height:100%;border:0;}
.offline-map{display:none;width:100%;height:100%;position:relative;overflow:hidden;background:#f2e8d0;}
.offline-map.active{display:block;}
.offline-svg{width:100%;height:100%;display:block;}

/* BUDGET */
.budget-section{padding:0 0 70px;}
.budget{background:#0b211b;border:1px solid rgba(255,255,255,.09);border-radius:23px;padding:32px;box-shadow:0 25px 55px rgba(0,0,0,.3);}
.budget h2{font-family:'Playfair Display',serif;font-size:30px;margin-bottom:7px;}
.budget-description{color:#91a69d;font-size:13px;}

.budget-inputs{margin-top:22px;display:grid;grid-template-columns:1fr 1fr;gap:16px;max-width:640px;}
.input-box label{display:block;color:#91a69d;font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;margin-bottom:7px;}
.input-box select,
.input-box input{width:100%;padding:13px;border:none;outline:none;border-radius:10px;background:#edf4f1;color:#071713;font-size:15px;font-weight:700;font-family:inherit;}

.cost-grid{margin-top:22px;display:grid;grid-template-columns:repeat(3,1fr);gap:13px;}
.cost{padding:18px;border-radius:13px;background:#102a22;border:1px solid rgba(255,255,255,.07);}
.cost span{display:block;color:#91a69d;font-size:9px;letter-spacing:1px;text-transform:uppercase;margin-bottom:6px;}
.cost strong{font-size:15px;}
.total{margin-top:15px;padding:20px;border-radius:14px;background:#5bd0a8;color:#062119;}
.total span{font-size:10px;text-transform:uppercase;letter-spacing:1px;}
.total strong{display:block;font-size:27px;margin-top:4px;}

/* BOOKING */
.booking-section{padding:0 0 70px;}
.booking-heading{margin-bottom:26px;}
.booking-heading h2{font-family:'Playfair Display',serif;font-size:30px;margin-bottom:8px;}
.booking-heading p{color:#91a69d;font-size:13px;}
.booking-subhead{
    font-family:'Playfair Display',serif;
    font-size:20px;
    color:#5bd0a8;
    margin-top:32px;
    margin-bottom:14px;
    letter-spacing:.5px;
}
.booking-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;}
.booking-card{
    display:block;
    text-decoration:none;
    background:#0b211b;
    border:1px solid rgba(255,255,255,.08);
    border-radius:14px;
    padding:18px 20px;
    transition:.25s ease;
}
.booking-card:hover{
    background:#102a22;
    border-color:#5bd0a8;
    transform:translateY(-3px);
}
.booking-name{font-weight:700;font-size:14px;color:#f4f7f3;margin-bottom:6px;}
.booking-desc{font-size:12px;color:#91a69d;line-height:1.5;margin-bottom:10px;}
.booking-link{font-size:11px;font-weight:700;color:#5bd0a8;letter-spacing:1px;text-transform:uppercase;}

/* MODAL */
.modal{position:fixed;inset:0;z-index:2000;display:none;align-items:center;justify-content:center;padding:25px;background:rgba(1,7,5,.82);backdrop-filter:blur(9px);}
.modal.active{display:flex;}
.modal-box{width:850px;max-width:95%;max-height:90vh;overflow-y:auto;background:#0b211b;border:1px solid rgba(255,255,255,.12);border-radius:24px;box-shadow:0 35px 90px rgba(0,0,0,.7);position:relative;animation:openModal .25s ease;}
@keyframes openModal{from{opacity:0;transform:scale(.94);}to{opacity:1;transform:scale(1);}}
.modal-box img{width:100%;height:280px;object-fit:cover;display:block;}
.modal-body{padding:30px;}
.modal-body h2{font-family:'Playfair Display',serif;font-size:32px;margin-bottom:12px;}
.remark-title{color:#5bd0a8;font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;margin-bottom:10px;}
.remark{color:#c2d0ca;font-size:15px;line-height:1.8;}
.details{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:24px;}
.detail{background:#102a22;border:1px solid rgba(255,255,255,0.07);border-radius:14px;padding:20px;}
.detail span{display:block;color:#5bd0a8;font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:8px;}
.detail strong{font-size:15px;color:#edf4f1;font-weight:600;}
.modal-body .remark{color:#aebdb7;margin-bottom:24px;}
.modal-close{position:absolute;top:15px;right:15px;width:40px;height:40px;border-radius:50%;border:none;background:rgba(0,0,0,.55);color:white;font-size:22px;cursor:pointer;z-index:5;}

@media(max-width:750px){
  .hero h1{font-size:42px;}
  .details{grid-template-columns:1fr;}
  .loc-grid{grid-template-columns:1fr;}
  .cost-grid{grid-template-columns:1fr;}
  .budget-inputs{grid-template-columns:1fr;}
  .booking-grid{grid-template-columns:1fr;}
  .hero{height:420px;}
  .map-heading{flex-direction:column;align-items:flex-start;}
  .map-box{padding:18px;}
  .map-frame{height:420px;}
}
</style>
</head>

  </div>
</div>

function esc(s){
  if (s === null || s === undefined) return "";
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

let currentRich = null;

function openLoc(i){
  if (!currentRich || !currentRich.locations[i]) return;
  const l = currentRich.locations[i];
  document.getElementById("mImg").src = l.img;
  document.getElementById("mTitle").innerText = l.name;
  document.getElementById("mRemark").innerText = l.remark;
  document.getElementById("mTiming").innerText = l.timing;
  document.getElementById("mEntry").innerText = l.entry;
  document.getElementById("mSeason").innerText = l.season;
  document.getElementById("mFood").innerText = l.food;
  document.getElementById("mCost").innerText = l.cost;
  document.getElementById("mCategory").innerText = l.category;
  document.getElementById("locModal").classList.add("active");
  document.body.style.overflow = "hidden";
}
function closeLoc(e){
  if (e && e.target !== document.getElementById("locModal")) return;
  document.getElementById("locModal").classList.remove("active");
  document.body.style.overflow = "auto";
}
document.addEventListener("keydown", e => { if (e.key === "Escape") closeLoc({target: document.getElementById("locModal")}); });

function openMap(){
  const m = document.getElementById("mapSection");
  m.classList.add("show");
  setTimeout(()=>m.scrollIntoView({behavior:"smooth", block:"center"}), 50);
}
function closeMap(){ document.getElementById("mapSection").classList.remove("show"); }
function showOnline(){
  document.getElementById("onlineMap").style.display = "block";
  document.getElementById("offlineMap").classList.remove("active");
  document.getElementById("onlineBtn").classList.add("active");
  document.getElementById("offlineBtn").classList.remove("active");
}
function showOffline(){
  document.getElementById("onlineMap").style.display = "none";
  document.getElementById("offlineMap").classList.add("active");
  document.getElementById("offlineBtn").classList.add("active");
  document.getElementById("onlineBtn").classList.remove("active");
}

function calculateBudget(){
  const personsInput = document.getElementById("persons");
  const originInput = document.getElementById("origin");
  if (!personsInput || !originInput) return;

  const persons = parseInt(personsInput.value, 10);
  const p = isNaN(persons) || persons < 0 ? 0 : persons;
  const origin = originInput.value;
  const b = BUDGET[currentKey];
  if (!b) return;

  if (p === 0) {
    ["travelCost","stayCost","activityCost","totalCost"].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.innerText = "₹0";
    });
    return;
  }

  const travel = (b.travel[origin] || [0,0]);
  const tMin = travel[0]*p, tMax = travel[1]*p;
  const sMin = b.stay[0]*p, sMax = b.stay[1]*p;
  const aMin = b.act[0]*p,  aMax = b.act[1]*p;
  const totalMin = tMin+sMin+aMin, totalMax = tMax+sMax+aMax;

  document.getElementById("travelCost").innerText = "₹"+tMin.toLocaleString("en-IN")+" – ₹"+tMax.toLocaleString("en-IN");
  document.getElementById("stayCost").innerText = "₹"+sMin.toLocaleString("en-IN")+" – ₹"+sMax.toLocaleString("en-IN");
  document.getElementById("activityCost").innerText = "₹"+aMin.toLocaleString("en-IN")+" – ₹"+aMax.toLocaleString("en-IN");
  document.getElementById("totalCost").innerText = "₹"+totalMin.toLocaleString("en-IN")+" – ₹"+totalMax.toLocaleString("en-IN");
}

function updateTravelLabel(){
  const originInput = document.getElementById("origin");
  const label = document.getElementById("travelLabel");
  if (!originInput || !label) return;
  const displayName = DISPLAY_NAMES[currentKey] || currentKey;
  label.innerText = `Travel (${originInput.value} → ${displayName})`;
}

document.addEventListener("change", function(e){
  if (e.target && e.target.id === "origin") {
    updateTravelLabel();
    calculateBudget();
  }
});

function renderBooking(key){
  const b = BOOKING[key];
  if (!b) return "";

  function cards(list){
    return list.map(item => `
      <a href="${esc(item.url)}" target="_blank" rel="noopener" class="booking-card">
        <div class="booking-name">${esc(item.name)}</div>
        <div class="booking-desc">${esc(item.desc)}</div>
        <div class="booking-link">Visit →</div>
      </a>
    `).join("");
  }

  return `
    <section class="booking-section">
      <div class="booking-heading">
        <h2>Where to Stay & Book</h2>
        <p>Curated hotels, rentals and tour packages for your trip.</p>
      </div>

      <h3 class="booking-subhead">🏨 Hotels & Stays</h3>
      <div class="booking-grid">${cards(b.hotels || [])}</div>

      <h3 class="booking-subhead">🏍️ Bike & Scooter Rentals</h3>
      <div class="booking-grid">${cards(b.bikes || [])}</div>

      <h3 class="booking-subhead">🚗 Car Rentals</h3>
      <div class="booking-grid">${cards(b.cars || [])}</div>

      <h3 class="booking-subhead">✈️ Tour & Travel Packages</h3>
      <div class="booking-grid">${cards(b.tours || [])}</div>
    </section>
  `;
}

function render(d){
  const key = (d.name || "").toLowerCase().trim();
  currentKey = key;
  const img = IMG_OVERRIDE[key] || d.imageUrl || "https://images.unsplash.com/photo-1500534623283-312aade485b7?w=1600";
  const displayName = DISPLAY_NAMES[key] || d.name;
  const rich = RICH[key] || null;
  currentRich = rich;

  const remark = rich ? rich.remark : (d.description || "");
  const heroSubtitle = remark.substring(0, 180) + (remark.length > 180 ? "..." : "");

  let locationsSection = "";
  if (rich && rich.locations) {
    locationsSection = `
      <div class="section" style="margin-top:0;">
        <h2>Popular Locations</h2>
        <p>Click a location to see timing, cost, food and other details.</p>
        <div class="loc-grid">
          ${rich.locations.map((l, i) => `
            <div class="loc-card" onclick="openLoc(${i})">
              <img src="${esc(l.img)}" alt="${esc(l.name)}" onerror="this.src='https://images.unsplash.com/photo-1500534623283-312aade485b7?w=800'">
              <div class="loc-info">
                <div class="loc-tag">${esc(l.tag)}</div>
                <h3>${esc(l.name)}</h3>
                <p>${esc(l.note)}</p>
              </div>
            </div>
          `).join("")}
        </div>
      </div>
    `;
  }

  let altitudeDisclaimer = "";
  if (rich && rich.altitude) {
    altitudeDisclaimer = `
      <div class="notice" style="border-color:#e5b95c;background:#2a2110;">
        <strong style="color:#e5b95c;">⚠️ High-Altitude Travel Disclaimer</strong>
        This destination is at high altitude. Older adults, pregnant travellers and young children may need extra caution. Watch for headache, dizziness, nausea or breathlessness. Stay hydrated, allow time to acclimatise, and follow local medical guidance.
      </div>
    `;
  }

  const gmaps = GMAPS_EMBED[key] || "";
  const svgMap = SVGS[key] || "";
  const bud = BUDGET[key];
  const bookingSection = renderBooking(key);

  let mapSection = "";
  if (svgMap && gmaps) {
    mapSection = `
      <section class="map-section" id="mapSection">
        <div class="map-box">
          <div class="map-heading">
            <div>
              <h2>${esc(displayName)} Map</h2>
              <p>Explore ${esc(displayName)} online or use the preloaded tourist map without internet.</p>
            </div>
            <div class="map-buttons">
              <button class="map-toggle active" id="onlineBtn" onclick="showOnline()">Online Map</button>
              <button class="map-toggle" id="offlineBtn" onclick="showOffline()">Offline Map</button>
              <button class="close-map" onclick="closeMap()">×</button>
            </div>
          </div>
          <div class="map-frame">
            <div id="onlineMap" class="online-map">
              <iframe src="${esc(gmaps)}" loading="lazy" allowfullscreen></iframe>
            </div>
            <div id="offlineMap" class="offline-map">${svgMap}</div>
          </div>
        </div>
      </section>
    `;
  }

  let budgetSection = "";
  if (bud) {
    budgetSection = `
      <section class="budget-section">
        <div class="budget">
          <h2>${esc(displayName)} Budget Planner</h2>
          <p class="budget-description">Choose your departure city and number of travellers to estimate your trip cost.</p>

          <div class="budget-inputs">
            <div class="input-box">
              <label>Departing From</label>
              <select id="origin" onchange="calculateBudget()">
                ${ORIGINS.map(o => `<option value="${o}">${o}</option>`).join("")}
              </select>
            </div>
            <div class="input-box">
              <label>Number of Travellers</label>
              <input id="persons" type="number" min="0" step="1" value="2" oninput="calculateBudget()">
            </div>
          </div>

          <div class="cost-grid">
            <div class="cost"><span id="travelLabel">Travel (Delhi → ${esc(displayName)})</span><strong id="travelCost">₹0</strong></div>
            <div class="cost"><span>Stay + Food</span><strong id="stayCost">₹0</strong></div>
            <div class="cost"><span>Local + Activities</span><strong id="activityCost">₹0</strong></div>
          </div>

          <div class="total"><span>Estimated Total</span><strong id="totalCost">₹0</strong></div>

          <div style="margin-top:20px;padding:14px 16px;background:rgba(91,208,168,.08);border:1px solid rgba(91,208,168,.25);border-radius:10px;font-size:12px;color:#9cbfb0;line-height:1.6;">
            <b style="color:#5bd0a8;">ℹ️ Estimate only</b> — values are curated averages from MakeMyTrip, Booking.com and IRCTC. Live API pricing is on our roadmap.
          </div>
        </div>
      </section>
    `;
  }

  document.getElementById("content").innerHTML = `
    <section class="hero" style="background-image:url('${esc(img)}')">
      <div class="hero-content">
        <div class="hero-small">${esc(d.state)} • INDIA</div>
        <h1>${esc(displayName)}</h1>
        <p>${esc(heroSubtitle)}</p>
      </div>
    </section>
    <div class="container">
      ${locationsSection}
      ${altitudeDisclaimer}
      ${mapSection}
      ${budgetSection}
      ${bookingSection}
    </div>
  `;
  document.title = "YatraX | " + displayName;
  if (bud) {
    calculateBudget();
    updateTravelLabel();
  }
}

if (!destId) {
  document.getElementById("content").innerHTML =
    '<div class="loading" style="color:#e5b95c;">No destination specified.</div>';
} else {
  fetch(API_BASE + "/destinations/" + destId)
    .then(r => { if (!r.ok) throw new Error("Not found"); return r.json(); })
    .then(d => render(d))
    .catch(err => {
      document.getElementById("content").innerHTML =
        '<div class="loading" style="color:#e5b95c;">⚠️ Could not load destination.</div>';
      console.error(err);
    });
}
</script>

</body>
</html>
