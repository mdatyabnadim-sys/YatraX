<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YatraX | Login / Sign up</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css">
<link rel="stylesheet" href="auth.css">
</head>
<body>

<header>
    <a href="index.html" class="logo">Yatra<span>X</span></a>
    <div class="header-nav">
        <a href="wishlist.html" class="nav-link"><span class="heart-emoji">❤️</span><span id="wishlistBadge" class="wishlist-badge">0</span></a>
        <div id="authArea" class="auth-area"></div>
    </div>
</header>

<a class="back-btn" href="index.html" style="top: 22px;">← Back</a>

<div class="auth-card">
    <h1 id="cardTitle">Welcome back</h1>
    <p class="sub" id="cardSub">Sign in to continue your journey</p>

    <div class="tabs">
        <div class="tab active" data-mode="login" onclick="switchMode('login')">Login</div>
        <div class="tab" data-mode="signup" onclick="switchMode('signup')">Sign up</div>
    </div>

    <div class="error-box" id="errorBox"></div>
    <div class="success-box" id="successBox"></div>

    <form id="authForm" onsubmit="handleSubmit(event)">
        <div class="field" id="nameField" style="display:none;">
            <label>Full Name</label>
            <input type="text" id="name" placeholder="Your name" autocomplete="name">
        </div>
        <div class="field">
            <label>Email</label>
            <input type="email" id="email" placeholder="you@example.com" autocomplete="email" required>
        </div>
        <div class="field">
            <label>Password</label>
            <div class="pw-wrap">
                <input type="password" id="password" placeholder="Min 4 characters" autocomplete="current-password" required minlength="4">
                <button type="button" id="togglePw" onclick="togglePassword()">SHOW</button>
            </div>
        </div>
        <button type="submit" class="btn-primary" id="submitBtn">Login</button>
    </form>
</div>

<footer>
    <div class="footer-logo">Yatra<span>X</span></div>
    Explore more. Travel better.
</footer>

<script src="common.js"></script>
<script src="auth.js"></script>
</body>
</html>
